name: Render post images

on:
  push:
    branches: [main]
    paths: ['posts/**.json', 'render.py', '.github/workflows/render.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-color-emoji
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium
      - name: Render images that are missing
        run: |
          for spec in posts/*/*.json; do
            out="${spec%.json}.jpg"
            if [ ! -f "$out" ]; then python3 render.py "$spec" "$out"; fi
          done
      - name: Commit images
        env:
          GIT_AUTHOR_NAME: Rahul Raihan
          GIT_AUTHOR_EMAIL: surajit132012@gmail.com
          GIT_COMMITTER_NAME: Claude
          GIT_COMMITTER_EMAIL: noreply@anthropic.com
        run: |
          git add posts
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'Render post images'
          git push
